[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nonprofit-image-crop-pipeline"
version = "0.1.0"
description = "A typed Python service that maps nonprofit image jobs to channel-specific smart crops."
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
include = ["nonprofit_crops*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
